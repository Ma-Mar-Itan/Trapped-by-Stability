[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radiomics-stability"
version = "1.0.0"
description = "Falsification framework separating cluster stability from biological identity in multi-vendor breast-MRI radiomic phenotype discovery."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Malek" }]
keywords = ["radiomics", "breast-mri", "clustering", "harmonization", "combat", "reproducibility"]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "lifelines>=0.27",
    "matplotlib>=3.7",
    "neuroCombat>=0.2.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
